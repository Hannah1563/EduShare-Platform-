---
# ---------- Firewall (UFW) ----------
- name: Install UFW and fail2ban
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
    state: present

- name: Deny all incoming traffic by default
  community.general.ufw:
    direction: incoming
    default: deny

- name: Allow all outgoing traffic by default
  community.general.ufw:
    direction: outgoing
    default: allow

# Each host group lists its own rules in group_vars (bastion.yml, app.yml).
# SSH is always opened before UFW is enabled, so the connection is never cut off.
- name: Allow the traffic this host needs (and nothing else)
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port | string }}"
    proto: tcp
    from_ip: "{{ item.from }}"
    comment: "{{ item.comment }}"
  loop: "{{ firewall_rules }}"
  loop_control:
    label: "{{ item.port }} from {{ item.from }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled

# ---------- SSH hardening ----------
- name: Harden the SSH server
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-edushare-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

# ---------- fail2ban ----------
- name: Configure fail2ban to ban repeated SSH login failures
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Start fail2ban now and on every boot
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
