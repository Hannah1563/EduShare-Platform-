# Static inventory. Values come from Terraform:
#   cd ../terraform && terraform output bastion_public_ip app_vm_private_ip
#
# bastion: the only VM with a public IP (SSH entry point + Nginx web proxy)
# app:     the private VM running the app container; Ansible reaches it by
#          jumping through the bastion (see group_vars/app.yml)

[bastion]
edushare-bastion ansible_host=102.37.10.231

[app]
edushare-app ansible_host=10.20.2.4

[edushare:children]
bastion
app
