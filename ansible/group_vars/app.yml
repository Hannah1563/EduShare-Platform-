---
# The app VM has no public IP: every SSH connection jumps through the bastion.
ansible_ssh_common_args: >-
  -o ProxyCommand="ssh -i {{ ansible_ssh_private_key_file }} -o StrictHostKeyChecking=accept-new -W %h:%p -q {{ ansible_user }}@{{ bastion_public_ip }}"

# App VM firewall (UFW): only the bastion's subnet may connect, on SSH and the app port.
firewall_rules:
  - { port: "{{ ssh_port }}", from: "{{ public_subnet_cidr }}", rule: allow, comment: "SSH from bastion" }
  - { port: "{{ app_container_port }}", from: "{{ public_subnet_cidr }}", rule: allow, comment: "App traffic from Nginx on the bastion" }
